<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Merriweather:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ---------- theme ---------- */
  :root{
    --host-bg:#0f1115; --host-fg:#e8eaee; --host-fg-muted:#8b94a3;
    --host-card:#171a20; --host-card-fg:#e8eaee; --host-input:#1d2128;
    --host-muted:#141821; --host-border:#2a303a; --host-border-hover:#3d4552;
    --host-primary:#6f8cff; --host-secondary:#1d2128; --host-secondary-fg:#e8eaee;
    --host-success:#22c55e; --host-error:#ef4444;
  }
  @media (prefers-color-scheme: light){
    :root{
      --host-bg:#f6f7f9; --host-fg:#15181d; --host-fg-muted:#5f6875;
      --host-card:#ffffff; --host-card-fg:#15181d; --host-input:#ffffff;
      --host-muted:#eef0f4; --host-border:#dfe3e9; --host-border-hover:#c2c9d4;
      --host-primary:#3b5bfd; --host-secondary:#eef0f4; --host-secondary-fg:#15181d;
      --host-success:#16a34a; --host-error:#dc2626;
    }
  }
  html[data-theme="light"]{
    --host-bg:#f6f7f9; --host-fg:#15181d; --host-fg-muted:#5f6875;
    --host-card:#ffffff; --host-card-fg:#15181d; --host-input:#ffffff;
    --host-muted:#eef0f4; --host-border:#dfe3e9; --host-border-hover:#c2c9d4;
    --host-primary:#3b5bfd; --host-secondary:#eef0f4; --host-secondary-fg:#15181d;
    --host-success:#16a34a; --host-error:#dc2626;
  }
  html[data-theme="dark"]{
    --host-bg:#0f1115; --host-fg:#e8eaee; --host-fg-muted:#8b94a3;
    --host-card:#171a20; --host-card-fg:#e8eaee; --host-input:#1d2128;
    --host-muted:#141821; --host-border:#2a303a; --host-border-hover:#3d4552;
    --host-primary:#6f8cff; --host-secondary:#1d2128; --host-secondary-fg:#e8eaee;
    --host-success:#22c55e; --host-error:#ef4444;
  }
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--host-bg);color:var(--host-fg);
       font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  *{box-sizing:border-box}

  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;color:var(--host-fg)}
  .topbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--host-border);background:var(--host-card)}
  .brand{font-weight:600;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px;margin-right:6px}
  .brand i{width:8px;height:8px;border-radius:50%;background:var(--host-primary);display:inline-block}
  .btn{font:inherit;font-size:12px;padding:6px 11px;border-radius:7px;border:1px solid var(--host-border);background:var(--host-secondary);color:var(--host-secondary-fg);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--host-border-hover)}
  .btn.primary{background:var(--host-primary);color:#fff;border-color:transparent;font-weight:500}
  .btn.primary:hover{opacity:.92}
  .btn.mini{padding:2px 6px;font-size:11px;line-height:1.3}
  .btn:disabled{opacity:.6;cursor:default}

  .workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:360px 1fr;overflow:hidden;background:var(--host-bg)}
  .editor{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;
          padding:10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--host-border)}
  .editor::-webkit-scrollbar,.page-pane::-webkit-scrollbar{width:10px}
  .editor::-webkit-scrollbar-thumb,.page-pane::-webkit-scrollbar-thumb{background:var(--host-border);border-radius:9px}
  .editor::-webkit-scrollbar-thumb:hover,.page-pane::-webkit-scrollbar-thumb:hover{background:var(--host-border-hover)}
  html,body{height:100%;overflow:hidden}
  body{margin:0;background:var(--host-bg);color:var(--host-fg);
       font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
  *{box-sizing:border-box}

  #app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;color:var(--host-fg)}
  .topbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--host-border);background:var(--host-card)}
  .brand{font-weight:600;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:7px;margin-right:auto}
  .brand i{width:8px;height:8px;border-radius:50%;background:var(--host-primary);display:inline-block}
  .btn{font:inherit;font-size:12px;padding:6px 11px;border-radius:7px;border:1px solid var(--host-border);background:var(--host-secondary);color:var(--host-secondary-fg);cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--host-border-hover)}
  .btn.primary{background:var(--host-primary);color:#fff;border-color:transparent;font-weight:500}
  .btn.primary:hover{opacity:.92}
  .btn.mini{padding:2px 6px;font-size:11px;line-height:1.3}
  .btn:disabled{opacity:.6;cursor:default}

  /* grid row clamped to the shell height; min-height:0 is what permits it */
  .workspace{flex:1 1 0%;min-height:0;display:grid;grid-template-columns:360px 1fr;overflow:hidden;background:var(--host-bg)}

  /* block layout: nothing can shrink-to-fit, so the panel really overflows */
  .editor{display:block;height:100%;min-height:0;overflow-y:scroll;overscroll-behavior:contain;
          scrollbar-gutter:stable;padding:10px;border-right:1px solid var(--host-border)}
  .editor > *,.editor details.acc{flex:0 0 auto}
  .editor details.acc{margin-bottom:6px}

  .editor::-webkit-scrollbar,.page-pane::-webkit-scrollbar{width:10px}
  .editor::-webkit-scrollbar-thumb,.page-pane::-webkit-scrollbar-thumb{background:var(--host-border);border-radius:9px}
  .editor::-webkit-scrollbar-thumb:hover,.page-pane::-webkit-scrollbar-thumb:hover{background:var(--host-border-hover)}
  .editor::-webkit-scrollbar-track,.page-pane::-webkit-scrollbar-track{background:transparent}

  details.acc{border:1px solid var(--host-border);border-radius:8px;background:var(--host-card);overflow:hidden}
  details.acc>summary{list-style:none;cursor:grab;padding:9px 11px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px;user-select:none}
  details.acc>summary:active{cursor:grabbing}
  details.acc>summary::-webkit-details-marker{display:none}
  details.acc>summary .stitle{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  details.acc>summary>input[type=checkbox]{flex:0 0 auto;margin:0}
  details.acc>summary::after{content:"+";margin-left:8px;opacity:.5;flex:0 0 auto}
  details.acc[open]>summary::after{content:"–"}
  details.acc.dragging{opacity:.45;outline:2px dashed var(--host-border-hover);outline-offset:1px}
  details.acc>summary .arrows{margin-left:auto;display:flex;gap:2px}
  .body{padding:2px 11px 11px;display:flex;flex-direction:column;gap:7px}
  .lbl{font-size:11px;color:var(--host-fg-muted);margin-bottom:3px;display:block}
  input[type=text],input[type=email],input[type=month],select,textarea{width:100%;font:inherit;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--host-border);background:var(--host-input);color:var(--host-fg);outline:none}
  textarea{resize:vertical;line-height:1.45}
  input:focus,select:focus,textarea:focus{border-color:var(--host-border-hover)}
  .row{display:flex;gap:6px}
  .row>*{flex:1;min-width:0}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--host-fg-muted);cursor:pointer}
  .chk input{accent-color:var(--host-primary)}
  .item{border:1px solid var(--host-border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--host-muted)}
  .item-head{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--host-fg-muted);font-weight:500;cursor:grab;user-select:none;margin:-8px -8px 0;padding:5px 8px;border-bottom:1px solid var(--host-border)}
  .item-head:active{cursor:grabbing}
  .item-head .grip{opacity:.5;letter-spacing:-2px}
  .item-head .sp{margin-left:auto;display:flex;gap:3px}
  .item.dragging{opacity:.45;outline:2px dashed var(--host-border-hover);outline-offset:1px}
  .hint{font-size:11px;color:var(--host-fg-muted);line-height:1.5}
  .swatches{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .sw{width:20px;height:20px;border-radius:5px;border:1px solid rgba(128,128,128,.4);cursor:pointer;padding:0}
  input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--host-border);border-radius:6px;background:var(--host-input);cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--host-primary)}
  .photobox{display:flex;gap:9px;align-items:center;border:1px dashed var(--host-border);border-radius:8px;padding:8px}
  .photobox img{width:46px;height:46px;object-fit:cover;border-radius:5px;background:var(--host-muted);flex:0 0 auto}
  .photobox .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .meter{height:6px;border-radius:4px;background:var(--host-muted);overflow:hidden;border:1px solid var(--host-border)}
  .meter i{display:block;height:100%;background:var(--host-primary);transition:width .15s}
  .meter.warn i{background:#f59e0b}
  .meter.bad i{background:var(--host-error)}
  .readout{font-size:11px;color:var(--host-fg-muted);display:flex;justify-content:space-between;gap:8px}

  .page-pane{min-height:0;overflow:auto;overscroll-behavior:contain;
             padding:8px 18px 40px;background:var(--host-muted)}
  .tbgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tbgroup.ml{margin-left:auto}
  .tbgroup.act{border-left:1px solid var(--host-border);padding-left:8px}
  .topbar select{width:auto;min-width:0;font-size:12px;padding:5px 7px;border-radius:7px;border:1px solid var(--host-border);background:var(--host-input);color:var(--host-fg)}
  .topbar input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--host-border);border-radius:7px;background:var(--host-input);cursor:pointer}
  .pc{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--host-border);color:var(--host-fg-muted);white-space:nowrap}
  .pc.over{border-color:var(--host-error);color:var(--host-error)}
  .pc.good{border-color:var(--host-success);color:var(--host-success)}
  #pageWrap{position:relative;display:flex;justify-content:center}
  #pageScaler{margin:0 auto;position:relative;flex:0 0 auto}
  #page{width:794px;min-height:1122px;background:#ffffff;color:#1a1a1a;transform-origin:top left;font-family:Inter,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.22)}
  #page *{box-sizing:border-box}
  #overflowLine{position:absolute;left:-7px;right:-7px;height:0;border-top:2px dashed #ef4444;z-index:3;pointer-events:none;display:none}
  #overflowLine b{position:absolute;right:0;top:2px;font-size:9px;font-weight:500;color:#ef4444;background:#fff;padding:0 3px}
  #overflowTint{position:absolute;left:0;right:0;background:rgba(239,68,68,.05);z-index:2;pointer-events:none;display:none}
  .status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--host-card);border:1px solid var(--host-border);color:var(--host-fg);padding:7px 14px;border-radius:20px;font-size:11.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
  .status.on{opacity:1}

  /* ============ SHEET ============ */
  #page{font-size:var(--fs,13.5px);line-height:var(--lh,1.42)}
  .pad-classic{padding:var(--pady,52px) var(--padx,56px)}
  .pad-modern{padding:0 0 var(--pady,52px)}
  .pad-elegant{padding:0}
  .photo{width:var(--pw);height:var(--ph);object-fit:cover;display:block;flex:0 0 auto;background:#e9ebee;object-position:center 22%}
  .photo.shape-square{border-radius:3px}
  .photo.shape-rounded{border-radius:14px}
  .photo.shape-circle{border-radius:50%}
  .hdr-text{flex:1;min-width:0}
  .hdr-classic{text-align:center;margin-bottom:calc(var(--secgap,16px)*0.7)}
  .hdr-classic.has-photo{display:flex;align-items:center;gap:calc(var(--padx,56px)*0.35);text-align:left}
  .hdr-classic h1{font-size:var(--h1s,2.1em);margin:0;letter-spacing:.5px;font-weight:700;line-height:1.1}
  .hdr-classic .title{font-size:1.02em;margin-top:2px;letter-spacing:calc(2px*var(--track,1));text-transform:uppercase;color:#555}
  .hdr-classic .contact{margin-top:calc(var(--entrygap,11px)*0.5);font-size:.83em;color:#444;line-height:1.5}
  .rule{height:2px;background:var(--acc);margin:calc(var(--secgap,16px)*0.6) 0 calc(var(--secgap,16px)*0.85)}
  .hdr-modern{background:var(--acc);color:#fff;padding:calc(var(--pady,52px)*0.58) var(--padx,56px) calc(var(--pady,52px)*0.46);margin-bottom:calc(var(--secgap,16px)*1.1)}
  .hdr-modern.has-photo{display:flex;align-items:center;gap:calc(var(--padx,56px)*0.35)}
  .hdr-modern h1{font-size:var(--h1s,2.1em);margin:0;font-weight:700;color:#fff;line-height:1.1}
  .hdr-modern .title{font-size:1em;opacity:.92;margin-top:2px;letter-spacing:calc(1.4px*var(--track,1));text-transform:uppercase}
  .hdr-modern .contact{font-size:.82em;margin-top:calc(var(--entrygap,11px)*0.6);opacity:.95;line-height:1.5}
  .hdr-modern .photo{border:3px solid rgba(255,255,255,.85)}
  .layout-elegant{display:flex;min-height:1122px}
  .side{width:250px;flex:0 0 250px;background:#f2f3f5;padding:calc(var(--pady,52px)*0.62) calc(var(--padx,56px)*0.4);border-right:1px solid #e3e5e9}
  .maincol{flex:1;padding:calc(var(--pady,52px)*0.62) calc(var(--padx,56px)*0.57) calc(var(--pady,52px)*0.75);min-width:0}
  .side .photo{margin:0 auto calc(var(--entrygap,11px)*1.2)}
  .side .name{font-size:1.5em;font-weight:700;line-height:1.15;margin:0 0 2px;text-align:center}
  .side .role{font-size:.86em;color:#666;margin-bottom:calc(var(--entrygap,11px)*1.2);letter-spacing:.6px;text-transform:uppercase;text-align:center}
  .side .sec-title{font-size:.78em;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc);border-bottom:1px solid #d9dbe0;padding-bottom:3px;margin:calc(var(--secgap,16px)*0.85) 0 calc(var(--secgap,16px)*0.4)}
  .side .contact-item{font-size:.8em;color:#3c4149;margin-bottom:3px;word-break:break-word}
  .side .chips{display:flex;flex-wrap:wrap;gap:4px}
  .side .chip{background:#fff;border:1px solid #dfe1e6;border-radius:10px;padding:2px 7px;font-size:.76em;color:#3c4149}
  .side .lang{display:flex;justify-content:space-between;font-size:.8em;color:#3c4149;margin-bottom:2px;gap:8px}
  .side .lang span:last-child{color:#777}
  .sec{margin-bottom:calc(var(--secgap,16px)*0.6);break-inside:avoid}
  .sec-title{font-size:.86em;font-weight:700;letter-spacing:calc(1.8px*var(--track,1));text-transform:uppercase;color:var(--acc);margin:0 0 calc(var(--secgap,16px)*0.45);padding-bottom:2px;border-bottom:1px solid #dcdfe4}
  .sec-classic .sec-title{border-bottom:1.5px solid #1a1a1a;color:#1a1a1a}
  .sec-modern .sec-title{border-bottom:none;color:var(--acc);border-left:3px solid var(--acc);padding-left:8px}
  .entry{margin-bottom:var(--entrygap,11px);break-inside:avoid}
  .entry:last-child{margin-bottom:0}
  .entry-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .entry-role{font-weight:700;font-size:1.01em;line-height:1.25}
  .entry-date{font-size:.8em;color:#666;white-space:nowrap}
  .entry-sub{font-size:.87em;color:#4a4a4a;font-style:italic;margin-bottom:2px}
  ul.bul{margin:2px 0 0;padding-left:var(--bidx,16px)}
  ul.bul li{margin-bottom:calc(var(--entrygap,11px)*0.2);font-size:.93em;line-height:var(--lh,1.42)}
  ul.bul.cols2{column-count:2;column-gap:26px}
  .summary{margin:0;font-size:.95em;line-height:var(--lh,1.42)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{background:#eef0f3;border-radius:3px;padding:2px 8px;font-size:.83em;color:#333}
  .skill-row{display:flex;justify-content:space-between;font-size:.9em;margin-bottom:2px}
  .bar{height:4px;background:#e2e5ea;border-radius:3px;overflow:hidden;margin-bottom:calc(var(--entrygap,11px)*0.5)}
  .bar>i{display:block;height:100%;background:var(--acc)}
  .plain{margin:0;font-size:.92em;line-height:var(--lh,1.42)}
  .body-cols{column-count:2;column-gap:calc(var(--padx,56px)*0.6)}
  .body-cols .sec{break-inside:avoid}

  @media (max-width:900px){
    .workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,44%) minmax(0,56%)}
    .editor{border-right:none;border-bottom:1px solid var(--host-border)}
  }
  @media print{
    @page{size:A4 portrait;margin:0}
    .topbar,.editor,#overflowLine,#overflowTint,.status{display:none!important}
    html,body{height:auto;overflow:visible}
    body{background:#fff}
    #app{height:auto;overflow:visible;display:block}
    .workspace{display:block;overflow:visible}
    .page-pane{padding:0;overflow:visible;background:#fff}
    #pageWrap{display:block}
    #pageScaler{width:auto!important;height:auto!important;margin:0}
    #page{transform:none!important;box-shadow:none;min-height:0!important}
  }
</style>
</head>
<body>

<div id="app">
 <div class="topbar">
    <div class="brand"><i></i>Resume studio</div>

    <div class="tbgroup ml">
      <select id="tplQuick" title="Template"></select>
      <input type="color" id="accQuick" title="Accent colour">
      <select id="zoomQuick" title="Preview zoom">
        <option value="0.6">60%</option><option value="0.7">70%</option><option value="0.85">85%</option>
        <option value="1" selected>100%</option><option value="1.25">125%</option>
      </select>
      <span class="pc" id="pageCount">1 page</span>
      <button class="btn mini" id="btnFit">Fit width</button>
    </div>

    <div class="tbgroup">
      <button class="btn" id="btnSample">Student sample</button>
      <button class="btn" id="btnClear">Clear</button>
      <button class="btn" id="btnExport">Save file</button>
      <button class="btn" id="btnImport">Open file</button>
      <button class="btn" id="btnFitOne">Fit 1 page</button>
      <button class="btn" id="btnPrint">Print</button>
      <button class="btn primary" id="btnPdf">Download PDF</button>
      <button class="btn" id="btnTheme" title="Toggle theme">◐</button>
    </div>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>

  <div class="workspace">
    <aside class="editor" id="editor">
      <details class="acc" data-section="basics" open>
        <summary>Personal details</summary>
        <div class="body">
          <div><label class="lbl">Full name</label><input type="text" data-bind="personal.name" placeholder="Alex Morgan"></div>
          <div><label class="lbl">Headline</label><input type="text" data-bind="personal.title" placeholder="CS student · Frontend developer"></div>
          <div class="row">
            <div><label class="lbl">Email</label><input type="text" data-bind="personal.email" placeholder="alex@mail.com"></div>
            <div><label class="lbl">Phone</label><input type="text" data-bind="personal.phone" placeholder="+1 555 0134"></div>
          </div>
          <div><label class="lbl">Location</label><input type="text" data-bind="personal.location" placeholder="Austin, TX"></div>
          <div class="row">
            <div><label class="lbl">Website</label><input type="text" data-bind="personal.website" placeholder="alexmorgan.dev"></div>
            <div><label class="lbl">LinkedIn</label><input type="text" data-bind="personal.linkedin" placeholder="linkedin.com/in/alex"></div>
          </div>
          <div><label class="lbl">GitHub / portfolio</label><input type="text" data-bind="personal.github" placeholder="github.com/alex"></div>
          <div class="photobox">
            <img id="photoThumb" alt="">
            <div class="col">
              <label class="chk"><input type="checkbox" data-bind="design.showPhoto"> Show photo</label>
              <input type="file" id="photoInput" accept="image/*" style="font-size:11px">
            </div>
          </div>
          <div class="row">
            <div><label class="lbl">Photo size</label>
              <select data-bind="design.photoSize">
                <option value="1">1 × 1 in</option><option value="1.5">1.5 × 1.5 in</option>
                <option value="2">2 × 2 in</option><option value="2.5">2.5 × 2.5 in</option>
              </select>
            </div>
            <div><label class="lbl">Shape</label>
              <select data-bind="design.photoShape">
                <option value="square">Square</option><option value="rounded">Rounded</option><option value="circle">Circle</option>
              </select>
            </div>
          </div>
          <div><label class="lbl">Photo side</label>
            <select data-bind="design.photoPos"><option value="left">Left of name</option><option value="right">Right of name</option></select>
          </div>
        </div>
      </details>

      <details class="acc" data-section="fit" open>
        <summary>Fit to one page</summary>
        <div class="body">
          <button class="btn primary" id="btnFitOne2">Fit everything on one page</button>
          <label class="chk"><input type="checkbox" data-bind="design.autoFit"> Keep it on one page automatically</label>
          <div><label class="lbl">Compression <span id="kOut">0%</span></label><input type="range" min="0" max="1" step="0.02" data-bind="design.fitK"></div>
          <div class="readout"><span id="typeOut">Type 13.5px · 10.1pt</span><span id="fillOut">0%</span></div>
          <div class="meter" id="meter"><i style="width:0%"></i></div>
          <div><label class="lbl">Body layout</label>
            <select data-bind="design.bodyCols">
              <option value="1">Single column</option><option value="2">Two columns (saves ~35%)</option>
            </select>
          </div>
          <div class="hint" id="fitHint">Compression shrinks gaps first, then leading, then type. Type never drops below 10.5px (~7.9pt).</div>
        </div>
      </details>

      <div id="sectionHost"></div>

      <details class="acc" data-section="custom">
        <summary>Custom sections</summary>
        <div class="body">
          <div id="customList"></div>
          <button class="btn" id="btnAddCustom">+ Add custom section</button>
          <div class="hint">Coursework, volunteering, hackathons, activities.</div>
        </div>
      </details>

      <details class="acc" data-section="design">
        <summary>Design &amp; layout</summary>
        <div class="body">
          <div><label class="lbl">Template</label>
            <select data-bind="design.template">
              <option value="classic">Classic</option><option value="modern">Modern</option><option value="elegant">Elegant (two column)</option>
            </select>
          </div>
          <div><label class="lbl">Typeface</label>
            <select data-bind="design.font">
              <option value="Inter, sans-serif">Inter (sans)</option>
              <option value="'Source Serif 4', Georgia, serif">Source Serif</option>
              <option value="Lora, Georgia, serif">Lora (serif)</option>
              <option value="Merriweather, Georgia, serif">Merriweather (serif)</option>
              <option value="ui-monospace, Menlo, monospace">Mono</option>
            </select>
          </div>
          <div><label class="lbl">Base density</label>
            <select data-bind="design.density">
              <option value="compact">Compact</option><option value="normal">Normal</option><option value="spacious">Spacious</option>
            </select>
          </div>
          <div><label class="lbl">Accent colour</label>
            <div class="swatches">
              <button class="sw" data-acc="#2563eb" style="background:#2563eb"></button>
              <button class="sw" data-acc="#0f766e" style="background:#0f766e"></button>
              <button class="sw" data-acc="#7c3aed" style="background:#7c3aed"></button>
              <button class="sw" data-acc="#b91c1c" style="background:#b91c1c"></button>
              <button class="sw" data-acc="#c2410c" style="background:#c2410c"></button>
              <button class="sw" data-acc="#111827" style="background:#111827"></button>
              <input type="color" data-bind="design.accent">
            </div>
          </div>
          <div><label class="lbl">Page margin <span id="padOut">80%</span></label><input type="range" min="0.4" max="1.4" step="0.05" data-bind="design.padScale"></div>
        </div>
      </details>
    </aside>

    <main class="page-pane" id="pagePane">
  
      <div id="pageWrap">
        <div id="pageScaler">
          <div id="page" class="t-classic pad-classic"></div>
          <div id="overflowTint"></div>
          <div id="overflowLine"><b>page 1 ends</b></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="status" id="status"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var LS = 'venice_resume_studio_v1';
  var THEME_KEY = 'venice_resume_theme';
  var VER = 5;
  var PAGE_H = 1122, PAGE_W = 794, FS_FLOOR = 10.5, INCH = 96;

  var TITLES = { summary:'Summary', experience:'Experience', education:'Education', projects:'Projects',
                 skills:'Skills', certifications:'Certifications', languages:'Languages', awards:'Awards' };
  var ORDER = ['summary','education','experience','projects','skills','certifications','awards','languages'];
  var SIMPLE_DEFAULT = ['skills','certifications','languages','awards'];

  var BASE = {
    compact:  { fs:12.4, lh:1.34, secgap:11, entrygap:7,  pady:36, padx:44, h1:1.95, bidx:14, track:0.9 },
    normal:   { fs:13.5, lh:1.42, secgap:16, entrygap:11, pady:52, padx:56, h1:2.10, bidx:16, track:1.0 },
    spacious: { fs:14.6, lh:1.52, secgap:20, entrygap:14, pady:60, padx:64, h1:2.25, bidx:18, track:1.1 }
  };
  var TIGHT = { fs:FS_FLOOR, lh:1.19, secgap:5.5, entrygap:3.5, pady:22, padx:30, h1:1.55, bidx:11, track:0.7 };

  function blank(){
    return {
      v: VER,
      design:{ template:'classic', font:'Inter, sans-serif', density:'normal', accent:'#2563eb', zoom:1,
               showPhoto:false, photo:null, photoSize:'2', photoShape:'square', photoPos:'left',
               skillsLayout:'inline', fitK:0, autoFit:false, bodyCols:'1', padScale:0.8 },
      titles: Object.assign({}, TITLES),
      mode:{ summary:'detailed', experience:'detailed', education:'detailed', projects:'detailed',
             skills:'simple', certifications:'simple', languages:'simple', awards:'simple' },
      simple:{ skills:'', certifications:'', languages:'', awards:'', projects:'' },
      show:{ summary:true, experience:true, education:true, projects:true, skills:true, certifications:true, languages:true, awards:true },
      order: ORDER.slice(),
      custom: [],
      personal:{ name:'', title:'', email:'', phone:'', location:'', website:'', linkedin:'', github:'', summary:'' },
      experience:[], education:[], projects:[], skills:[], certifications:[], languages:[], awards:[]
    };
  }

  var LISTS = {
    summary:{ fields:[] },
    experience:{ fields:[
      {k:'role',p:'Role',w:'h'},{k:'company',p:'Organisation',w:'h'},
      {k:'start',t:'month'},{k:'end',t:'month'},
      {k:'current',t:'check',label:'Ongoing'},
      {k:'location',p:'City, country'},
      {k:'bullets',t:'area',p:'One achievement per line.'}
    ]},
    education:{ fields:[
      {k:'degree',p:'Degree / programme',w:'h'},{k:'school',p:'School',w:'h'},
      {k:'start',t:'month'},{k:'end',t:'month'},
      {k:'location',p:'City, country'},
      {k:'notes',t:'area',p:'GPA, honours, relevant coursework (one per line)'}
    ]},
    projects:{ fields:[
      {k:'name',p:'Project name',w:'h'},{k:'tech',p:'Stack / role',w:'h'},
      {k:'link',p:'Link'},
      {k:'bullets',t:'area',p:'What it does and your impact (one per line)'}
    ]},
    skills:{ fields:[{k:'name',p:'Skill',w:'h'},{k:'level',t:'select',opts:['','Basic','Intermediate','Advanced','Expert'],w:'h'}]},
    certifications:{ fields:[
      {k:'name',p:'Certification',w:'h'},{k:'issuer',p:'Issuer',w:'h'},
      {k:'date',t:'month'},{k:'id',p:'Credential ID',w:'h'}
    ]},
    languages:{ fields:[{k:'name',p:'Language',w:'h'},{k:'level',p:'Level (e.g. Fluent, B2)',w:'h'}]},
    awards:{ fields:[{k:'title',p:'Award / honour',w:'h'},{k:'date',t:'month',w:'h'},{k:'note',p:'One line of context'}]}
  };

  var state = load() || blank();
  migrate();
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmtMonth(v){ if(!v) return ''; var p=v.split('-'); return (MON[+p[1]-1]||'')+' '+p[0]; }
  function range(a,b,cur){ var s=fmtMonth(a), e=cur?'Present':fmtMonth(b); if(s&&e) return s+' – '+e; return s||e; }
  function get(path){ return path.split('.').reduce(function(o,k){ return o==null?undefined:o[k]; }, state); }
  function set(path,val){ var p=path.split('.'), o=state; for(var i=0;i<p.length-1;i++){ o=o[p[i]]; } o[p[p.length-1]]=val; }
  function lines(key){ return String(state.simple[key]||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean); }
  function bullets(arr){ return arr.length ? '<ul class="bul">'+arr.map(function(l){ return '<li>'+esc(l)+'</li>'; }).join('')+'</ul>' : ''; }

  var mem = {};
  function save(){ var j=JSON.stringify(state); try{ localStorage.setItem(LS, j); }catch(e){ mem[LS]=j; } }
  var saveT, toastT;
  function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(save,400); }
  function load(){
    try{
      var r = localStorage.getItem(LS) || mem[LS];
      if(!r) return null;
      return merge(blank(), JSON.parse(r));
    }catch(e){ return null; }
  }
  function merge(base, over){
    Object.keys(over||{}).forEach(function(k){
      if(over[k] && typeof over[k]==='object' && !Array.isArray(over[k]) && base[k] && typeof base[k]==='object' && !Array.isArray(base[k])) merge(base[k], over[k]);
      else base[k]=over[k];
    });
    return base;
  }
  function toast(msg){ var s=$('#status'); s.textContent=msg; s.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ s.classList.remove('on'); },2400); }

  function fillSimple(key){
    var map = { skills:['name','level'], certifications:['name','issuer'], languages:['name','level'], awards:['title','note'] };
    var f = map[key]; if(!f) return;
    state.simple[key] = (state[key]||[]).map(function(x){ return [x[f[0]], x[f[1]]].filter(Boolean).join(' — '); }).join('\n');
  }
  function migrate(){
    if((state.v||1) < 2){
      if(Array.isArray(state.skills) && state.skills.length && !state.simple.skills){
        state.simple.skills = state.skills.map(function(x){ return [x.name, x.level].filter(Boolean).join(' — '); }).join('\n');
        state.skills = [];
      }
      state.show.certifications = true; state.show.awards = true;
    }
    if((state.v||1) < 3){ SIMPLE_DEFAULT.forEach(function(k){ if(!state.simple[k] && Array.isArray(state[k]) && state[k].length) fillSimple(k); }); }
    state.v = VER;
  }
/* ================= DRAG AND DROP ================= */
  var dragSrc = null;
  function enableDrag(container, itemSel, handleSel, onDone){
    Array.prototype.forEach.call(container.querySelectorAll(itemSel), function(el){
      var handle = handleSel ? el.querySelector(handleSel) : el;
      if(!handle) return;
      el.classList.add('draggable');
      handle.draggable = true;
      handle.addEventListener('dragstart', function(e){
        dragSrc = el;
        e.dataTransfer.effectAllowed = 'move';
        try{ e.dataTransfer.setData('text/plain',''); }catch(err){}
        setTimeout(function(){ el.classList.add('dragging'); }, 0);
      });
      handle.addEventListener('dragend', function(){
        el.classList.remove('dragging');
        dragSrc = null;
        onDone();
      });
      el.addEventListener('dragover', function(e){
        if(!dragSrc || dragSrc === el || dragSrc.parentNode !== el.parentNode) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        var r = el.getBoundingClientRect();
        var before = (e.clientY - r.top) < r.height / 2;
        var p = el.parentNode;
        if(before) p.insertBefore(dragSrc, el);
        else p.insertBefore(dragSrc, el.nextSibling);
      });
      el.addEventListener('drop', function(e){ e.preventDefault(); });
    });
  }
  function commitSectionOrder(){
    var keys = Array.prototype.map.call(host.children, function(c){ return c.dataset.section; })
                 .filter(function(k){ return ORDER.indexOf(k) >= 0; });
    if(keys.length) state.order = keys;
    renderEditor(); renderPreview(); saveSoon();
  }
  function commitListOrder(key){
    var wrap = $('#list-'+key); if(!wrap) return;
    var idxs = Array.prototype.map.call(wrap.children, function(c){ return +c.dataset.idx; });
    state[key] = idxs.map(function(i){ return state[key][i]; });
    renderEditor(); renderPreview(); saveSoon();
  }
  function commitCustomOrder(){
    var idxs = Array.prototype.map.call(customHost.children, function(c){ return +c.dataset.idx; });
    state.custom = idxs.map(function(i){ return state.custom[i]; });
    renderCustom(); renderPreview(); saveSoon();
  }
  /* ---------------- fit engine ---------------- */
  var curScale = 0.45, curFs = 13.5;

  function applyVars(){
    var b = BASE[state.design.density] || BASE.normal;
    var k = Math.max(0, Math.min(1, state.design.fitK||0));
    var page = $('#page');
    function mix(key){ return b[key] + (TIGHT[key]-b[key])*k; }
    page.style.setProperty('--fs', mix('fs').toFixed(2)+'px');
    page.style.setProperty('--lh', mix('lh').toFixed(3));
    page.style.setProperty('--secgap', mix('secgap').toFixed(2)+'px');
    page.style.setProperty('--entrygap', mix('entrygap').toFixed(2)+'px');
    var ps = state.design.padScale || 1;
    page.style.setProperty('--pady', Math.round(mix('pady')*ps)+'px');
    page.style.setProperty('--padx', Math.round(mix('padx')*ps)+'px');
    page.style.setProperty('--h1s', mix('h1').toFixed(3)+'em');
    page.style.setProperty('--bidx', Math.round(mix('bidx'))+'px');
    page.style.setProperty('--track', mix('track').toFixed(3));
  }
  function contentHeight(){
    var page = $('#page'), prev = page.style.minHeight;
    page.style.minHeight = '0px';
    var h = page.offsetHeight;
    page.style.minHeight = prev;
    return h;
  }
  function fitToOnePage(silent){
    var page = $('#page');
    page.style.minHeight = '0px';
    state.design.fitK = 0; applyVars();
    var natural = page.offsetHeight, res;
    if(natural <= PAGE_H){
      res = { k:0, h:natural, ok:true };
    } else {
      var lo=0, hi=1;
      state.design.fitK = 1; applyVars();
      var atMax = page.offsetHeight;
      if(atMax <= PAGE_H){
        for(var i=0;i<16;i++){
          var mid=(lo+hi)/2;
          state.design.fitK = mid; applyVars();
          if(page.offsetHeight <= PAGE_H) hi=mid; else lo=mid;
        }
        state.design.fitK = hi; applyVars();
        res = { k:hi, h:page.offsetHeight, ok:true, compressed:true };
      } else { res = { k:1, h:atMax, ok:false }; }
    }
    page.style.minHeight = '';
    state.design.fitK = res.k;
    applyVars(); fit(); updateHUD();
    if(!silent){
      if(res.ok && !res.compressed) toast('Already fits one page');
      else if(res.ok) toast('Fits one page · '+Math.round(res.k*100)+'% compression · type '+curFs.toFixed(1)+'px');
      else toast('Still over one page — try two columns or trim a bullet');
    }
    return res;
  }
  function autoFitRun(){
    if(!state.design.autoFit) return;
    var r = fitToOnePage(true);
    if(!r.ok && state.design.bodyCols !== '2'){
      state.design.bodyCols = '2'; renderPreview();
      var r2 = fitToOnePage(true);
      toast(r2.ok ? 'Two-column body enabled to fit one page' : 'Still over — trim a bullet or two');
      syncInputs();
    }
  }
  function updateHUD(){
    var h = contentHeight();
    var fill = Math.min(200, (h/PAGE_H)*100);
    var m = $('#meter'), bar = m.querySelector('i');
    bar.style.width = Math.min(100, fill)+'%';
    m.className = 'meter' + (h>PAGE_H*1.001 ? (h>PAGE_H*1.15?' bad':' warn') : '');
    $('#fillOut').textContent = Math.round(fill)+'% of a page';
    curFs = parseFloat(getComputedStyle($('#page')).fontSize);
    $('#typeOut').textContent = 'Type '+curFs.toFixed(1)+'px · '+(curFs*0.75).toFixed(1)+'pt';
    $('#padOut').textContent = Math.round((state.design.padScale||1)*100)+'%';
    var pc = $('#pageCount');
    var pages = Math.max(1, Math.ceil((h-6)/PAGE_H));
    pc.textContent = pages===1 ? 'Fits 1 page' : pages+' pages';
    pc.className = 'pc' + (pages===1 ? ' good' : ' over');
    var s = curScale, line = $('#overflowLine'), tint = $('#overflowTint');
    if(pages>1){
      line.style.display='block'; tint.style.display='block';
      line.style.top = (PAGE_H*s)+'px';
      tint.style.top = (PAGE_H*s)+'px';
      tint.style.height = Math.max(0,(h-PAGE_H)*s)+'px';
    } else { line.style.display='none'; tint.style.display='none'; }
    $('#fitHint').textContent = pages>1
      ? 'Overflowing by '+Math.round((h-PAGE_H)/PAGE_H*100)+'% of a page. Hit Fit everything on one page.'
      : (curFs <= FS_FLOOR+0.4
          ? 'At the legibility floor (10.5px ≈ 7.9pt) — trim a bullet instead of shrinking further.'
          : 'Compression shrinks gaps first, then leading, then type. Type never drops below 10.5px (~7.9pt).');
  }

  /* ---------------- editor ---------------- */
  var host = $('#sectionHost'), customHost = $('#customList');

  function sectionShell(key){
    var hasList = LISTS[key].fields.length > 0;
    var detailed = hasList && state.mode[key] !== 'simple';
    var d = document.createElement('details');
    d.className='acc'; d.dataset.section=key;
    d.innerHTML =
      '<summary><span class="stitle">'+esc(state.titles[key]||TITLES[key])+'</span></summary>'+
      '<div class="body">'+
        '<div><label class="lbl">Section heading</label><input type="text" data-bind="titles.'+key+'"></div>'+
        (hasList ?
          '<div class="row">'+
            '<div><label class="lbl">Format</label><select data-mode="'+key+'">'+
              '<option value="simple">Simple list</option><option value="detailed">Detailed entries</option></select></div>'+
            (key==='skills' ? '<div><label class="lbl">Layout</label><select data-bind="design.skillsLayout">'+
              '<option value="inline">Inline, comma separated</option>'+
              '<option value="bullets">Bulleted list</option>'+
              '<option value="columns">Bulleted, two columns</option></select></div>' : '')+
          '</div>' : '')+
       '<div id="simple-'+key+'" hidden><label class="lbl">'+(key==='summary'?'Your profile text':'One item per line')+'</label>'+
          '<textarea rows="6" data-bind="'+(key==='summary'?'personal.summary':'simple.'+key)+'"></textarea></div>'+
        '<div id="list-'+key+'"></div>'+
        '<button class="btn" data-add="'+key+'">+ Add entry</button>'+
        '<div class="hint" id="empty-'+key+'"></div>'+
      '</div>';
    var cb = document.createElement('input');
    cb.type='checkbox'; cb.checked = !!state.show[key]; cb.title='Show on resume';
    cb.style.cssText='accent-color:var(--host-primary);margin:0';
    cb.addEventListener('click', function(e){ e.stopPropagation(); });
    cb.addEventListener('change', function(){ state.show[key]=cb.checked; renderPreview(); saveSoon(); });
    d.querySelector('summary').insertBefore(cb, d.querySelector('summary').firstChild.nextSibling);
    var ms = d.querySelector('[data-mode]'); if(ms) ms.value = state.mode[key];
    d.querySelector('#simple-'+key).hidden = detailed;
    d.querySelector('#list-'+key).hidden = !detailed;
    d.querySelector('[data-add]').hidden = !detailed || !hasList;
    return d;
  }

  function itemEditor(key, i){
    var box = document.createElement('div'); box.className='item'; box.dataset.idx = i;
    var head = document.createElement('div'); head.className='item-head';
    head.innerHTML = '<span class="grip">⣿</span><span>#'+(i+1)+'</span><span class="sp">'+
      '<button class="btn mini" data-act="del" data-list="'+key+'" data-i="'+i+'">✕</button></span>';
    box.appendChild(head);
    var rowBuf=[];
    function flush(){
      if(!rowBuf.length) return;
      var r=document.createElement('div'); r.className = rowBuf.length>1?'row':'';
      rowBuf.forEach(function(el){ r.appendChild(el); });
      box.appendChild(r); rowBuf=[];
    }
    LISTS[key].fields.forEach(function(f){
      var wrap=document.createElement('div'), input;
      if(f.t==='area'){ input=document.createElement('textarea'); input.rows=3; }
      else if(f.t==='check'){ input=document.createElement('input'); input.type='checkbox'; }
      else if(f.t==='select'){ input=document.createElement('select'); f.opts.forEach(function(o){ var op=document.createElement('option'); op.value=o; op.textContent=o||'— level —'; input.appendChild(op); }); }
      else if(f.t==='month'){ input=document.createElement('input'); input.type='month'; }
      else { input=document.createElement('input'); input.type='text'; }
      input.dataset.bind = key+'.'+i+'.'+f.k;
      var val = state[key][i][f.k];
      if(f.t==='check'){ input.checked=!!val; } else { input.value = val==null?'':val; }
      if(f.t==='check'){
        var lab=document.createElement('label'); lab.className='chk';
        lab.appendChild(input); lab.appendChild(document.createTextNode(f.label||f.k));
        wrap.appendChild(lab); flush(); box.appendChild(wrap); return;
      }
      var lb=document.createElement('label'); lb.className='lbl'; lb.textContent=f.p||f.k;
      wrap.appendChild(lb); wrap.appendChild(input);
      if(f.w==='h'){ rowBuf.push(wrap); } else { flush(); box.appendChild(wrap); }
    });
    flush();
    return box;
  }

  function customEditor(c, i){
    var box=document.createElement('div'); box.className='item'; box.dataset.idx = i;
    box.innerHTML =
      '<div class="item-head"><span class="grip">⣿</span><span>Section #'+(i+1)+'</span><span class="sp">'+
      '<button class="btn mini" data-cact="del" data-i="'+i+'">✕</button></span></div>'+
      '<div><label class="lbl">Heading</label><input type="text" data-cbind="'+i+'.title" placeholder="Coursework"></div>'+
      '<div><label class="lbl">One item per line</label><textarea rows="4" data-cbind="'+i+'.items"></textarea></div>'+
      '<label class="chk"><input type="checkbox" data-cbind="'+i+'.show"> Show on resume</label>';
    box.querySelector('[data-cbind="'+i+'.title"]').value = c.title||'';
    box.querySelector('[data-cbind="'+i+'.items"]').value = c.items||'';
    box.querySelector('[data-cbind="'+i+'.show"]').checked = c.show!==false;
    return box;
  }

  function renderCustom(){
    customHost.innerHTML='';
    state.custom.forEach(function(c,i){ customHost.appendChild(customEditor(c,i)); });
    enableDrag(customHost, '.item', '.item-head', commitCustomOrder);
  }

  function renderEditor(){
    host.innerHTML='';
    state.order.forEach(function(key){
      var d=sectionShell(key);
      host.appendChild(d);
      var itemsWrap = d.querySelector('#list-'+key);
      (state[key]||[]).forEach(function(_,i){ itemsWrap.appendChild(itemEditor(key,i)); });
      d.querySelector('#empty-'+key).textContent = (state[key]||[]).length ? '' : (state.mode[key]==='simple' ? '' : 'No entries yet.');
      enableDrag(itemsWrap, '.item', '.item-head', function(){ commitListOrder(key); });
    });
    renderCustom();
    syncInputs();
    enableDrag(host, 'details.acc', 'summary', commitSectionOrder);
  }

  function syncInputs(){
    document.querySelectorAll('[data-bind]').forEach(function(el){
      var v = get(el.dataset.bind);

/* ================= PDF EXPORT =================
     Captures an offscreen copy with PINNED crop bounds, verifies the
     result isn't blank, retries with another renderer, then builds the
     PDF directly with jsPDF. */
function getLibs(){
    var h2c = window.html2canvas || null;
    var J = (window.jspdf && (window.jspdf.jsPDF || window.jspdf)) || null;
    if(window.html2pdf){
      if(!h2c) h2c = window.html2pdf.html2canvas || null;
      if(!J){ var c = window.html2pdf.jsPDF || window.html2pdf.jsPdf; if(c) J = c.jsPDF || c; }
    }
    return { h2c:h2c, JsPDF:J };
  }
  function isBlankCanvas(c){
    try{
      var ctx=c.getContext('2d'), w=c.width, h=c.height;
      var d=ctx.getImageData(0,0,w,h).data, n=0;
      for(var y=0;y<h;y+=13){
        for(var x=0;x<w;x+=13){
          var i=(y*w+x)*4;
          if(d[i]<248||d[i+1]<248||d[i+2]<248){ n++; if(n>40) return false; }
        }
      }
      return true;
    }catch(e){ return false; }
  }
  function writePdf(canvas, name, JsPDF){
    var pdf = new JsPDF({ unit:'mm', format:'a4', orientation:'portrait', compress:true });
    var PW=210, PH=297;
    var imgW=PW, imgH=canvas.height*PW/canvas.width;
    var img=canvas.toDataURL('image/jpeg',0.94);
    var pages=Math.max(1, Math.ceil(imgH/PH-0.002));
    for(var p=0;p<pages;p++){
      if(p>0) pdf.addPage();
      pdf.addImage(img,'JPEG',0,-p*PH,imgW,imgH);
    }
    pdf.save(name);
  }
  $('#btnPdf').addEventListener('click', function(){
    var btn=this, libs=getLibs();
    if(!libs.h2c){ toast('Capture library not loaded — check your connection, or use Print'); return; }
    if(!libs.JsPDF){ toast('PDF writer not loaded — check your connection, or use Print'); return; }
    btn.disabled=true; var old=btn.textContent; btn.textContent='Rendering…';

    var src=$('#page'), prevT=src.style.transform;
    src.style.transform='none';

    var holder=document.createElement('div');
    holder.style.cssText='position:absolute;left:0;top:0;width:794px;background:#ffffff;z-index:99999;overflow:visible;';
    var clone=src.cloneNode(true);
    clone.style.transform='none';
    clone.style.boxShadow='none';
    clone.style.margin='0';
    clone.style.minHeight='0px';
    holder.appendChild(clone);
    document.body.appendChild(holder);

    var contentH=clone.offsetHeight;
    var H = contentH<=PAGE_H ? PAGE_H : contentH;
    clone.style.height=H+'px';

    function cleanup(){
      if(holder.parentNode) holder.remove();
      src.style.transform=prevT; fit();
      btn.disabled=false; btn.textContent=old;
    }

    var base={ x:0, y:0, width:PAGE_W, height:H, scrollX:0, scrollY:0,
               useCORS:true, allowTaint:true, logging:false, backgroundColor:'#ffffff' };
    var tries=[
      Object.assign({}, base, { scale:2 }),
      Object.assign({}, base, { scale:2, foreignObjectRendering:true }),
      Object.assign({}, base, { scale:1 })
    ];
    function go(i){
      if(i>=tries.length){ cleanup(); toast('Capture came back blank — use Print → Save as PDF'); return; }
      libs.h2c(clone, tries[i]).then(function(canvas){
        if(isBlankCanvas(canvas) && i<tries.length-1){ go(i+1); return; }
        try{ writePdf(canvas, fileName('pdf'), libs.JsPDF); cleanup(); toast('PDF downloaded'); }
        catch(err){ cleanup(); toast('PDF failed — use Print → Save as PDF'); }
      }).catch(function(){ go(i+1); });
    }
    setTimeout(function(){ go(0); }, 80);
  });

    s.custom = [{ title:'Activities', items:'Computer Science Society — events lead\nOpen-source contributor: 12 merged PRs in 2025', show:true }];
    state = s;
    renderEditor(); renderPreview(); syncQuick(); save();
    fitToOnePage(true);
    toast('Student sample loaded and fitted to one page');
  }

  /* ---------------- boot ---------------- */
  if(!localStorage.getItem(LS) && !mem[LS]) loadSample();
  else { renderEditor(); renderPreview(); syncQuick(); }
  setTimeout(function(){ fit(); updateHUD(); }, 300);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit(); updateHUD(); if(state.design.autoFit) autoFitRun(); });
})();
</script>
</body>
</html>
